<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fafaf7">
<title>Omni-DL · Media decoder</title>
<link rel="stylesheet" href="/interface.css">
</head>
<body>
<header class="mast">
  <div class="shell mast-inner">
    <a class="wordmark" href="#main" aria-label="Omni-DL home"><i aria-hidden="true"></i>omni<span>/</span>dl</a>
    <nav aria-label="Main navigation">
      <a href="#decoder">Decoder</a><a href="#queue">Queue</a><a href="/api/health" target="_blank" rel="noopener">API <span class="arrow" aria-hidden="true"></span></a>
    </nav>
  </div>
</header>
<main class="shell" id="main">
  <section class="hero" aria-labelledby="hero-title">
    <div class="intro">
      <div class="signal" role="status"><span class="led" id="led"></span><span id="tickMsg">Connecting</span></div>
      <h1 id="hero-title">Media<br><em>decoder<span>.</span></em></h1>
      <p>Extract video and audio from a source URL.</p>
    </div>
    <div class="art" aria-hidden="true"><img src="/assets/phase-wings.webp" alt="" width="1200" height="720" fetchpriority="high"></div>
  </section>

  <section class="panel" id="decoder" aria-labelledby="source-title">
    <div class="panel-head"><h2 id="source-title">Source input</h2><span class="ribs" aria-hidden="true"></span></div>
    <form id="form">
      <label for="url">Media URL</label>
      <div class="source-row">
        <div class="url-field"><span class="arrow" aria-hidden="true"></span><input id="url" type="url" placeholder="https://…" autocomplete="url" required></div>
        <button type="submit" class="btn primary" id="inspect">Decode <span class="arrow" aria-hidden="true"></span></button>
      </div>
    </form>
    <div id="meta" hidden>
      <div class="displaygrid">
        <div class="thumb-wrap" hidden><img id="thumb" alt=""></div>
        <div><h3 id="mtitle"></h3><div class="sub" id="msub"></div><p class="desc" id="mdesc"></p></div>
      </div>
      <div class="formats-wrap"><table id="formats"><caption>Available formats</caption>
        <thead><tr><th>ID</th><th>Type</th><th>Resolution</th><th>Size</th><th>Note</th></tr></thead><tbody></tbody>
      </table></div>
    </div>
    <div id="controls" hidden>
      <h3>Download settings</h3>
      <div class="settings">
        <label>Format<select id="format"><option value="mp4">MP4 video</option><option value="webm">WebM video</option><option value="mp3">MP3 audio</option><option value="m4a">M4A audio</option><option value="audio">Opus audio</option></select></label>
        <label>Quality<select id="quality"><option value="best">Best available</option><option value="2160">2160p</option><option value="1440">1440p</option><option value="1080" selected>1080p</option><option value="720">720p</option><option value="480">480p</option><option value="360">360p</option></select></label>
        <button class="btn primary" id="go">Add to queue <span aria-hidden="true">→</span></button>
      </div>
      <div class="barwrap"><i id="barfill"></i><span class="pcttext" id="pcttext"></span></div>
      <div class="pct"><span id="pstate">Idle</span><span id="pspeed"></span></div>
    </div>
  </section>

  <section class="panel" id="queue" aria-labelledby="queue-title">
    <div class="panel-head"><h2 id="queue-title">Download queue</h2><span class="count" id="queueTag">0 jobs</span><span class="ribs" aria-hidden="true"></span></div>
    <div id="jobs"><div class="empty">No downloads queued.</div></div>
  </section>

  <footer>
    <label class="key-label" for="apikey">API key <input type="password" id="apikey" placeholder="Optional" autocomplete="off"></label>
    <div class="footer-links"><a href="https://github.com/Guru322/omni-dl">GitHub <span class="arrow" aria-hidden="true"></span></a><a href="/assets/CREDITS.txt">Credits <span class="arrow" aria-hidden="true"></span></a></div>
  </footer>
</main>

<script>
const $ = (id) => document.getElementById(id);
const currentUrl = () => {
  try { const u = new URL($('url').value.trim()); if (!/^https?:$/.test(u.protocol)) throw 0; return u.href; }
  catch { return null; }
};

/* api key handling: stored locally, sent as x-api-key on every call.
   File links use ?key= because <a href> downloads can't carry custom headers. */
const apiKey = () => (localStorage.getItem('apiKey') || '').trim();
const authHeaders = () => {
  const h = { 'content-type': 'application/json' };
  const k = apiKey();
  if (k) h['x-api-key'] = k;
  return h;
};
const authed = (path) => apiKey() ? path + (path.includes('?') ? '&' : '?') + 'key=' + encodeURIComponent(apiKey()) : path;

$('apikey').value = apiKey();
$('apikey').addEventListener('input', (e) => {
  localStorage.setItem('apiKey', e.target.value.trim());
  tick();
});

async function tick() {
  try {
    const response = await fetch('/api/health', { headers: authHeaders() });
    if (!response.ok) throw new Error(response.status === 401 ? 'API key required' : 'Engine offline');
    const health = await response.json();
    $('led').className = 'led';
    $('tickMsg').textContent = health.running ? `Engine online · ${health.running} running` : 'Engine online';
  } catch (err) {
    $('led').className = 'led off';
    $('tickMsg').textContent = err.message === 'API key required' ? err.message : 'Engine offline';
  }
}
setInterval(tick, 4000); tick();

/* inspect */
$('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const url = currentUrl(); if (!url) return alert('invalid url');
  $('inspect').disabled = true; $('inspect').firstChild.textContent = 'Decoding… ';
  try {
    const res = await fetch('/api/info?url=' + encodeURIComponent(url), { headers: authHeaders() });
    const info = await res.clone().json();
    if (info.error) throw new Error(info.error + (info.detail ? ' — ' + info.detail : ''));
    $('meta').hidden = false;
    $('controls').hidden = false;
    $('mtitle').textContent = info.title || '(untitled)';
    $('msub').textContent = [info.extractor, info.uploader, info.duration_string].filter(Boolean).join('  ·  ');
    const d = $('mdesc'); d.className = 'desc'; d.textContent = info.description || '';
    const thumb = $('thumb');
    thumb.parentElement.hidden = !info.thumbnail;
    thumb.onerror = () => { thumb.parentElement.hidden = true; };
    if (info.thumbnail) thumb.src = info.thumbnail;
    $('formats').hidden = !info.formats?.length;
    const tb = $('formats').querySelector('tbody'); tb.textContent = '';
    (info.formats || []).filter(f => !String(f.note).includes('m3u8')).slice(0, 24).forEach(f => {
      const tr = document.createElement('tr');
      for (const [v, cls] of [[f.format_id, ''], [f.ext, ''], [f.resolution ?? '', ''],
        [f.filesize ? (f.filesize / 1048576).toFixed(1) + ' MB' : '', 'dim'],
        [f.note ?? '', 'dim']]) {
        const td = document.createElement('td'); td.textContent = v; if (cls) td.className = cls; tr.appendChild(td);
      }
      tb.appendChild(tr);
    });
  } catch (err) {
    $('meta').hidden = false; $('controls').hidden = true;
    $('thumb').parentElement.hidden = true; $('formats').hidden = true;
    $('mtitle').textContent = 'Couldn’t decode this URL';
    $('msub').textContent = '';
    const d = $('mdesc'); d.className = 'desc err'; d.textContent = err.message;
  } finally { $('inspect').disabled = false; $('inspect').firstChild.textContent = 'Decode '; }
});

/* queue */
$('go').addEventListener('click', async () => {
  const url = currentUrl(); if (!url) return alert('invalid url');
  const res = await fetch('/api/download', {
    method: 'POST', headers: authHeaders(),
    body: JSON.stringify({ url, format: $('format').value, quality: $('quality').value }),
  });
  if (!res.ok) { const j = await res.json(); alert(j.error || 'failed to queue'); return; }
  const job = await res.json(); jobs[job.id] = job; render();
});

/* jobs poll */
let jobs = {};
async function poll() {
  if (!Object.keys(jobs).length) return;
  const list = await (await fetch('/api/jobs', { headers: authHeaders() })).json();
  list.forEach(j => { if (jobs[j.id]) jobs[j.id] = j; });
  const latest = Object.values(jobs).sort((a, b) => b.createdAt - a.createdAt)[0];
  if (latest) setProgress(latest);
  render();
}
setInterval(poll, 1500);
function setProgress(j) {
  const fill = $('barfill');
  fill.style.width = Math.max(0, j.progress ?? 0) + '%';
  fill.className = j.status === 'done' ? 'done' : j.status === 'error' ? 'err' : '';
  $('pcttext').textContent = j.status === 'done' ? 'TRANSFER COMPLETE' : j.status === 'error' ? 'TRANSFER FAULT' : (j.progress ?? 0) + '%';
  $('pstate').textContent = 'Status: ' + j.status + (j.status === 'error' ? ' · ' + (j.error || '').trim().slice(-70) : '');
  $('pspeed').textContent = [j.speed, j.eta && 'eta ' + j.eta].filter(Boolean).join('  ·  ');
}

function el(tag, cls, text) { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }

function render() {
  const box = $('jobs');
  const list = Object.values(jobs).sort((a, b) => b.createdAt - a.createdAt);
  $('queueTag').textContent = `${list.length} ${list.length === 1 ? 'job' : 'jobs'}`;
  if (!list.length) { box.textContent = ''; box.appendChild(el('div', 'empty', 'No downloads queued.')); return; }
  box.textContent = '';
  list.forEach(j => {
    const card = el('div', 'job');
    const top = el('div', 'top');
    top.appendChild(el('div', j.status === 'error' ? 'title err' : 'title', j.info?.title || j.url));
    const side = el('div',
      j.status === 'done' ? 'side ok' : 'side',
      j.status + (j.status !== 'done' ? ' ' + (j.progress ?? 0) + '%' : ' ' + ((j.fileSize ?? 0) / 1048576).toFixed(1) + ' MB'));
    top.appendChild(side); card.appendChild(top);

    const body = el('div', 'body');
    if (['downloading', 'merging', 'queued', 'processing'].includes(j.status)) {
      const bar = el('div', 'barwrap'); const i = el('i'); i.style.width = (j.progress ?? 0) + '%'; bar.appendChild(i);
      const t = el('span', 'pcttext', (j.progress ?? 0) + '%'); bar.appendChild(t);
      body.appendChild(bar);
    } else if (j.status === 'error') {
      body.appendChild(el('div', 'err', (j.error || '').trim().slice(-160)));
    } else if (j.status === 'done') {
      body.appendChild(el('div', 'ok', '» ' + ((j.fileSize ?? 0) / 1048576).toFixed(1) + ' MB — transfer complete'));
    }
    card.appendChild(body);

    const ops = el('div', 'ops');
    if (j.status === 'done') {
      const a = el('a', '', 'SAVE FILE →'); a.href = authed(`/api/jobs/${j.id}/file`);
      a.download = ''; ops.appendChild(a);
    }
    const bx = el('button', 'btn btn-ghost btn-mini', j.status === 'error' ? 'DISMISS' : (['downloading', 'merging', 'queued'].includes(j.status) ? 'CANCEL' : 'REMOVE'));
    bx.addEventListener('click', async () => { await fetch(authed(`/api/jobs/${j.id}`), { method: 'DELETE', headers: authHeaders() }); await poll(); if (j.id in jobs) delete jobs[j.id]; render(); });
    ops.appendChild(bx);
    card.appendChild(ops);
    box.appendChild(card);
  });
}
</script>
</body>
</html>
